/* \u044F\u0433\u043E\u0434\u043D\u043E\u0435 \u0441\u0432\u0435\u0447\u0435\u043D\u0438\u0435 \u0442\u0451\u043C\u043D\u044B\u0445 \u043A\u0430\u0440\u0442\u043E\u0447\u0435\u043A \u0432 \u043D\u043E\u0447\u043D\u043E\u0439 \u0442\u0435\u043C\u0435 */
.app.dark .board,.app.dark .dishcard{
  background:
    linear-gradient(160deg, rgba(230,74,110,.07), rgba(230,74,110,.02) 60%),
    var(--boardbg);
}
.app.dark .sheet-wrap{background:rgba(0,0,0,.58)}
*{box-sizing:border-box;margin:0;padding:0}
button{color:inherit}
html,body,#root{height:100%}
body{overflow-x:hidden;overscroll-behavior-y:none}
.app::before{content:'';position:fixed;inset:0;background:var(--bg);z-index:-1}
.app{
  min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:'Golos Text',system-ui,sans-serif;font-size:15px;
  max-width:520px;margin:0 auto;
  padding:env(safe-area-inset-top) 14px calc(108px + env(safe-area-inset-bottom));
}
.mono{font-family:'JetBrains Mono',monospace}
input{font-size:16px!important}
input::placeholder{color:var(--sub);opacity:.55}
.loading{padding:48px;text-align:center;color:var(--sub)}

/* ---- \u043D\u0438\u0436\u043D\u044F\u044F \u043D\u0430\u0432\u0438\u0433\u0430\u0446\u0438\u044F: \u0436\u0438\u0434\u043A\u043E\u0435 \u0441\u0442\u0435\u043A\u043B\u043E ---- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:max(12px,env(safe-area-inset-bottom));z-index:40;
  display:flex;gap:4px;padding:5px;border-radius:999px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--glassline);
  box-shadow:0 10px 32px rgba(0,0,0,.20)}
.tabbar button{border:0;background:transparent;cursor:pointer;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 22px;border-radius:999px;color:var(--sub);
  font-size:11px;font-weight:600;letter-spacing:.01em;
  transition:background .15s,color .15s}
.tabbar button.on{background:var(--pill);color:var(--pillT)}
.tabbar svg{display:block}

/* ---- \u0448\u0430\u043F\u043A\u0430 ---- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.hsl{font-family:'Unbounded',sans-serif;font-weight:500;font-size:19px;color:var(--line)}
.hsec{font-family:'Unbounded',sans-serif;font-weight:700;font-size:19px;
  text-transform:uppercase;letter-spacing:.02em;color:var(--accent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:19px;
  letter-spacing:.02em;text-transform:uppercase}

/* ---- \u0442\u0451\u043C\u043D\u043E\u0435 \u0442\u0430\u0431\u043B\u043E ---- */
.board{background:var(--boardbg);color:#F2F4F0;border:1px solid var(--boardline);border-radius:22px;
  padding:18px 18px 16px;position:relative}
.board-top{display:flex;justify-content:space-between;align-items:baseline}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#9AA69E;font-weight:500}
.weight{font-size:14px;color:#C8D0C8}
.weight i{font-style:normal;color:#8C978E;font-size:12px}
.kcal{display:flex;align-items:baseline;gap:10px;margin:6px 0 8px}
.kcal-n{font-family:'Unbounded',sans-serif;font-weight:700;font-size:52px;
  line-height:1;letter-spacing:-.01em}
.kcal-u{font-size:15px;color:#9AA69E}
.goal{height:8px;border-radius:5px;background:#3A443D;overflow:hidden;margin-bottom:6px}
.goal i{display:block;height:100%;background:#F2F4F0;border-radius:5px;transition:width .3s}
.goal-cap{font-size:12px;color:#9AA69E}
.goal-cap.over{color:#FF8A9E}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:#2A332D}
.bar i{display:block;min-width:3px;transition:width .3s ease}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#C8D0C8}
.chip i{width:8px;height:8px;border-radius:50%}
.chip b{color:#fff;font-weight:700;font-size:12.5px}
.per100{margin-top:12px;padding-top:10px;border-top:1px solid #2E3831;
  font-size:12px;color:#9AA69E}

/* ---- \u0446\u0435\u043B\u0438 ---- */
.mgoals{margin-top:14px;padding-top:12px;border-top:1px solid #2E3831;
  display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px}
.mrow .ml{width:22px;font-size:12px;color:#C8D0C8;font-weight:500}
.mrow .mb{flex:1;height:7px;border-radius:4px;background:#3A443D;overflow:hidden}
.mrow .mb i{display:block;height:100%;border-radius:4px;transition:width .3s}
.mrow .mb.empty-bar{background:transparent}
.mrow .mv{font-size:12px;color:#C8D0C8;width:96px;text-align:right;flex-shrink:0}
.mrow .mv b{color:#fff}
.mrow.hero .ml,.mrow.hero .mv{font-size:12.5px}

/* ---- \u043D\u0430\u0432\u0438\u0433\u0430\u0446\u0438\u044F \u043F\u043E \u0434\u043D\u044F\u043C ---- */
.daynav{display:flex;align-items:center;justify-content:space-between;margin:0 2px}
.daynav b{font-size:15px}
.daynav button{border:0;background:var(--chipbg);width:44px;height:44px;border-radius:50%;
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.daynav button:disabled{opacity:.35}

/* ---- \u0441\u043F\u0438\u0441\u043A\u0438 ---- */
.list{display:flex;flex-direction:column;gap:8px}
.controls{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);
  border:.5px solid var(--line);border-radius:var(--r);padding:12px}
.row time{font-size:12px;color:var(--sub);flex-shrink:0;width:42px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;text-align:left}
.row-sub{font-size:11px;color:var(--sub)}
.row-sub i{font-style:normal;color:#9AA39C}
.entry-k{font-weight:700;font-size:14px;flex-shrink:0}
.dish-mark,.prod-mark,.food-mark{width:6px;align-self:stretch;border-radius:3px;flex-shrink:0}
.dish-mark{background:var(--accent)}
.food-mark{background:#E8A13B}
.prod-mark{background:var(--pmark)}
.sig{display:flex;width:46px;height:8px;border-radius:4px;overflow:hidden;flex-shrink:0}
.sig i{display:block}
.lib-row{cursor:pointer;font:inherit;text-align:left}
.empty{padding:22px 16px;text-align:center;color:var(--sub);
  background:var(--emptybg);border-radius:var(--r);font-size:14px}
.wchip{border:0;background:var(--fieldbg);border-radius:12px;
  padding:10px 13px;font-size:15px;color:var(--ink);flex-shrink:0;cursor:pointer}

/* ---- \u0441\u0432\u0430\u0439\u043F-\u0443\u0434\u0430\u043B\u0435\u043D\u0438\u0435 ---- */
.swipe{position:relative;border-radius:var(--r);overflow:hidden}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;
  background:var(--accent);color:#fff;font:inherit;font-weight:600;
  font-size:13px;cursor:pointer;border-radius:var(--r)}
.swipe-inner{position:relative;z-index:1;will-change:transform}

/* ---- \u043A\u043D\u043E\u043F\u043A\u0438 ---- */
.btn{border:0;font:inherit;font-weight:600;border-radius:14px;
  padding:13px 18px;cursor:pointer;transition:transform .06s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.solid{background:var(--accent);color:#fff}
.btn.ghost{background:var(--chipbg);border:0;color:var(--ink)}
.btn.ghost.danger{background:var(--picked);color:var(--accent)}
.btn.wide{width:100%}
.row-btns{display:flex;gap:10px;margin-top:8px}
.row-btns .solid{flex:1}

/* ---- \u0441\u0435\u0433\u043C\u0435\u043D\u0442\u0435\u0434 ---- */
.seg{display:flex;background:var(--fieldbg);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;text-align:center;padding:8px 0;
  border-radius:10px;font:inherit;font-size:13.5px;font-weight:500;
  color:var(--sub);cursor:pointer}
.seg button.on{background:var(--segon);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.tight{margin-bottom:0}

/* ---- \u043A\u043E\u043D\u0441\u0442\u0440\u0443\u043A\u0442\u043E\u0440 ---- */
.ctor-top{display:flex;align-items:center;gap:12px;padding:16px 0 14px}
.ctor-title{font-size:17px;font-weight:600}
.ctor-name{margin-bottom:8px}
.back{border:0;background:var(--chipbg);width:42px;height:42px;border-radius:50%;
  color:var(--ink);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ctor-actions{display:flex;gap:10px}
.ctor-actions .btn{flex:1}

/* ---- \u0442\u0451\u043C\u043D\u0430\u044F \u043A\u0430\u0440\u0442\u043E\u0447\u043A\u0430 \u043F\u043E\u0440\u0446\u0438\u0438 ---- */
.dishcard{background:var(--boardbg);color:#F2F4F0;border:1px solid var(--boardline);border-radius:20px;padding:16px}
.dc-name{font-weight:600;font-size:15px;margin-bottom:2px}
.sl-val{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.sl-val .n{font-family:'Unbounded',sans-serif;font-weight:700;font-size:40px;line-height:1}
.sl-val .u{color:#9AA69E;font-size:14px}
.sl-w{font-size:13px;color:#C8D0C8;margin:4px 0 10px}
.dc-bar{margin:12px 0 14px}
.dc-row{display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;color:#C8D0C8;gap:10px}
.dc-slider{margin-top:16px!important;height:40px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;
  background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;
  background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--p,100%),#2A332D var(--p,100%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
  border-radius:50%;background:#fff;border:3px solid var(--accent);margin-top:-8px;
  box-shadow:0 2px 6px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:#2A332D}
input[type=range]::-moz-range-progress{height:10px;border-radius:6px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
  background:#fff;border:3px solid var(--accent)}
.sl-macros{display:flex;gap:14px;margin-top:8px;font-size:12.5px;color:#C8D0C8}
.sl-macros b{color:#fff}

/* ---- \u0431\u0430\u0440\u0430\u0431\u0430\u043D ---- */
.wheel-wrap{position:relative;height:228px;border-radius:18px;background:var(--card);
  overflow:hidden}
.wheel-scroll{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.wheel-scroll::-webkit-scrollbar{display:none}
.wheel-scroll::before,.wheel-scroll::after{content:'';display:block;height:92px}
.wopt{height:44px;display:flex;align-items:center;justify-content:center;
  scroll-snap-align:center;font-family:'JetBrains Mono',monospace;font-size:19px;
  color:var(--sub)}
.wheel-line{position:absolute;left:10px;right:10px;top:50%;height:44px;
  transform:translateY(-50%);background:var(--picked);
  border-radius:13px;pointer-events:none}
.wheel-fade-t,.wheel-fade-b{position:absolute;left:0;right:0;height:84px;pointer-events:none}
.wheel-fade-t{top:0;background:linear-gradient(var(--card),var(--cardT))}
.wheel-fade-b{bottom:0;background:linear-gradient(var(--cardT),var(--card))}

.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat-wrap{will-change:transform}
.cat-wrap.lifting{position:relative;z-index:5}
.cat-wrap.lifting .row{box-shadow:0 0 0 1.5px var(--accent),0 8px 24px rgba(0,0,0,.22)}
.cat-input{flex:1;min-width:0;border:0;background:transparent;font:inherit;
  outline:none;color:var(--ink)}
.drag-h{border:0;background:transparent;color:var(--sub);font-size:19px;
  padding:2px 8px;cursor:grab;touch-action:none;flex-shrink:0;line-height:1}
.catbar{display:flex;gap:6px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 20px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 20px),transparent)}
.catbar.bleed{margin:0 -14px 0;padding:0 14px;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent);
  mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.sheet-body .catbar.bleed{margin:0 -16px;padding:0 16px;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 16px,#000 calc(100% - 16px),transparent);
  mask-image:linear-gradient(to right,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.catbar::-webkit-scrollbar{display:none}
.catchip{border:0;background:var(--fieldbg);color:var(--sub);
  border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;
  font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.catchip.on{background:var(--pill);color:var(--pillT)}
.cat-gear{display:flex;align-items:center;justify-content:center;padding:8px 11px}
.warn{background:var(--picked);border:1px solid var(--dangerB);color:var(--accent);
  border-radius:14px;padding:10px 14px;font-size:12.5px;line-height:1.45;
  font-weight:500}
.sec-l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--sub);font-weight:600;margin-top:2px}

/* ---- \u0444\u043E\u0440\u043C\u044B ---- */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2>*{min-width:0}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld-l{font-size:12px;color:var(--sub);font-weight:500}
.fld-box{display:flex;align-items:center;gap:6px;background:var(--fieldbg);
  border:0;border-radius:12px;padding:11px 13px}
.fld-box input{flex:1;min-width:0;border:0;background:transparent;
  font:inherit;outline:none;color:var(--ink)}
.fld-box em{font-style:normal;font-size:12px;color:var(--sub)}
.fld-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
main{display:flex;flex-direction:column;gap:12px}
main>.list{margin-top:10px}
.sheet-body>.pick-list,.sheet-body>.list{margin-top:10px}
.form{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12px;color:var(--sub);line-height:1.45}

/* ---- \u043F\u043E\u0438\u0441\u043A ---- */
.search-wrap{position:relative;flex:0 0 auto}
.srow{display:flex;gap:8px;align-items:stretch}
.srow .search-wrap{flex:1;min-width:0}
.btn.plus{width:48px;flex-shrink:0;padding:0;font-size:24px;font-weight:400;line-height:1;
  display:flex;align-items:center;justify-content:center}
.search{border:0;border-radius:14px;
  padding:13px 44px 13px 14px;font:inherit;background:var(--fieldbg);outline:none;color:var(--ink);width:100%;display:block}
.search-x{position:absolute;right:7px;top:50%;transform:translateY(-50%);
  border:0;background:var(--chipbg);width:30px;height:30px;border-radius:50%;
  color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ---- \u0448\u0442\u043E\u0440\u043A\u0430 ---- */
.sheet-wrap{position:fixed;inset:0;background:rgba(20,26,22,.45);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
  animation:fade .18s ease}
.sheet{position:relative;width:100%;max-width:520px;background:var(--bg);
  border-radius:24px 24px 0 0;padding:0;
  max-height:82dvh;overflow:hidden;
  display:flex;flex-direction:column;
  animation:up .22s ease}
.sheet-top{position:absolute;top:0;left:0;right:0;z-index:3;
  padding:8px 16px 16px;
  background:linear-gradient(to bottom,var(--bg) 28%,var(--bgH) 62%,var(--bgT) 96%)}
.sheet-top::before,.sheet-top::after{content:'';position:absolute;inset:0 0 -8px;
  z-index:-1;pointer-events:none}
.sheet-top::before{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  -webkit-mask-image:linear-gradient(to bottom,#000 40%,rgba(0,0,0,.55) 68%,transparent 96%);
  mask-image:linear-gradient(to bottom,#000 40%,rgba(0,0,0,.55) 68%,transparent 96%)}
.sheet-top::after{-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  -webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent 66%);
  mask-image:linear-gradient(to bottom,#000 30%,transparent 66%)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;scrollbar-width:none;
  display:flex;flex-direction:column;gap:12px;
  padding:80px 16px calc(var(--footH,0px) + 18px)}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-body>*{flex-shrink:0}
.sheet-body .board,.sheet-body .list,.sheet-body .controls{margin-bottom:0}
.sheet.full{height:calc(100dvh - env(safe-area-inset-top) - 12px);max-height:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--grab);margin:0 auto 8px;flex-shrink:0}
.sheet-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;
  display:flex;flex-direction:column;gap:8px;
  padding:24px 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 38%,var(--bgH) 68%,var(--bgT) 97%)}
.sheet-foot::before,.sheet-foot::after{content:'';position:absolute;inset:-8px 0 0;
  z-index:-1;pointer-events:none}
.sheet-foot::before{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  -webkit-mask-image:linear-gradient(to top,#000 45%,rgba(0,0,0,.55) 72%,transparent 97%);
  mask-image:linear-gradient(to top,#000 45%,rgba(0,0,0,.55) 72%,transparent 97%)}
.sheet-foot::after{-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  -webkit-mask-image:linear-gradient(to top,#000 34%,transparent 70%);
  mask-image:linear-gradient(to top,#000 34%,transparent 70%)}
.sheet-foot .btn{width:100%}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head b{font-size:16px}
.x-plain{border:0;background:transparent;color:var(--sub);width:44px;height:44px;
  margin:-5px -12px -5px 0;font-size:22px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pick-list{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border:.5px solid var(--line);background:var(--card);border-radius:14px;
  padding:13px 14px;font:inherit;cursor:pointer;text-align:left}
.pick:active{background:var(--picked)}
.pick.picked{background:var(--picked);border-color:var(--accent);
  box-shadow:inset 0 0 0 .5px var(--accent)}
.pick.picked span:first-child{color:var(--accent)}
.pick .sub{font-size:11.5px;color:var(--sub);flex-shrink:0}

@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fld-box input:focus,.search:focus{outline:none}
.fld-box:focus-within{box-shadow:0 0 0 1.5px var(--accent)}
.search:focus{box-shadow:0 0 0 1.5px var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
